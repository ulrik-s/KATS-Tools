name: Build installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: KATS-Tools
  PKG_ID: se.qnyx.kats-tools

jobs:
  macos-pkg:
    name: Build macOS pkg
    runs-on: macos-latest

    env:
      APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
      APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate required files
        shell: bash
        run: |
          test -f assets/KATS-Tools.dotm
          test -f assets/KATSUpdater.applescript
          test -f assets/KATSUpdater.bat
          test -f pkg/scripts/postinstall
          test -f ribbon/customUI.xml

      - name: Build pkg via Makefile
        shell: bash
        run: |
          make mac-pkg VERSION="${{ steps.version.outputs.version }}"

      - name: Prepare macOS artifact folder
        shell: bash
        run: |
          mkdir -p release/macos
          # Upload rebuilt .dotm only from one platform job
          cp "build/KATS-Tools.dotm" "release/macos/KATS-Tools.dotm"

          if [[ -f "build/KATS-Tools-${{ steps.version.outputs.version }}.pkg" ]]; then
            cp "build/KATS-Tools-${{ steps.version.outputs.version }}.pkg" "release/macos/"
          else
            cp "build/KATS-Tools-unsigned.pkg" "release/macos/KATS-Tools-${{ steps.version.outputs.version }}-unsigned.pkg"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/macos/

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    env:
      WINDOWS_SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_PFX_BASE64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate required files
        shell: pwsh
        run: |
          if (!(Test-Path assets/KATS-Tools.dotm)) { throw "Missing assets/KATS-Tools.dotm" }
          if (!(Test-Path assets/KATSUpdater.bat)) { throw "Missing assets/KATSUpdater.bat" }
          if (!(Test-Path windows/KATS-Tools.iss)) { throw "Missing windows/KATS-Tools.iss" }
          if (!(Test-Path ribbon/customUI.xml)) { throw "Missing ribbon/customUI.xml" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer via Makefile
        shell: pwsh
        run: |
          make windows-installer VERSION="${{ steps.version.outputs.version }}" ISCC="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

      - name: Prepare Windows artifact folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\windows | Out-Null
          # Do NOT copy KATS-Tools.dotm here; release asset names must be unique
          Copy-Item "build\windows\KATS-Tools-Setup-${{ steps.version.outputs.version }}.exe" "release\windows\"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/windows/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - macos-pkg
      - windows-installer
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: release/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release/windows

      - name: Create or update release and upload assets
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = existing.data;
            } catch (e) {
              if (e.status !== 404) throw e;
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true,
                draft: false,
                prerelease: false
              });
              release = created.data;
            }

            function collectFiles(dir, out) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  collectFiles(full, out);
                } else {
                  out.push(full);
                }
              }
            }

            const rawFiles = [];
            collectFiles('release/macos', rawFiles);
            collectFiles('release/windows', rawFiles);

            // Deduplicate by basename so same filename is never uploaded twice
            const filesByName = new Map();
            for (const file of rawFiles) {
              if (!fs.existsSync(file)) continue;
              const name = path.basename(file);
              if (!filesByName.has(name)) {
                filesByName.set(name, file);
              }
            }

            for (const [name, file] of filesByName.entries()) {
              const currentAssets = await github.rest.repos.listReleaseAssets({
                owner,
                repo,
                release_id: release.id
              });

              const old = currentAssets.data.find(a => a.name === name);
              if (old) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: old.id
                });
              }

              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data
              });
            }

