name: Build installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: KATS-Tools
  PKG_ID: se.qnyx.kats-tools

jobs:
  macos-pkg:
    name: Build macOS pkg
    runs-on: macos-latest

    env:
      APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
      APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate required files
        shell: bash
        run: |
          test -f assets/KATS-Tools.dotm
          test -f assets/KATSUpdater.applescript
          test -f assets/KATSUpdater.bat
          test -f pkg/scripts/postinstall

      - name: Build unsigned pkg
        shell: bash
        run: |
          set -euo pipefail
          chmod +x pkg/scripts/postinstall

          mkdir -p "build/payload/Library/Application Support/${APP_NAME}"
          cp "assets/KATS-Tools.dotm" "build/payload/Library/Application Support/${APP_NAME}/KATS-Tools.dotm"
          cp "assets/KATSUpdater.applescript" "build/payload/Library/Application Support/${APP_NAME}/KATSUpdater.applescript"
          cp "assets/KATSUpdater.bat" "build/payload/Library/Application Support/${APP_NAME}/KATSUpdater.bat"

          pkgbuild \
            --root "build/payload" \
            --identifier "${PKG_ID}" \
            --version "${{ steps.version.outputs.version }}" \
            --install-location "/" \
            --scripts "pkg/scripts" \
            "build/${APP_NAME}-unsigned.pkg"

      - name: Prepare Apple signing material
        if: ${{ env.APPLE_INSTALLER_CERT_P12_BASE64 != '' && env.APPLE_INSTALLER_CERT_PASSWORD != '' && env.APPLE_INSTALLER_IDENTITY != '' }}
        shell: bash
        run: |
          echo "$APPLE_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer-cert.p12"

      - name: Import Apple installer certificate
        if: ${{ env.APPLE_INSTALLER_CERT_P12_BASE64 != '' && env.APPLE_INSTALLER_CERT_PASSWORD != '' && env.APPLE_INSTALLER_IDENTITY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/installer-cert.p12" \
            -k build.keychain \
            -P "$APPLE_INSTALLER_CERT_PASSWORD" \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Sign pkg
        if: ${{ env.APPLE_INSTALLER_CERT_P12_BASE64 != '' && env.APPLE_INSTALLER_CERT_PASSWORD != '' && env.APPLE_INSTALLER_IDENTITY != '' }}
        shell: bash
        run: |
          productsign \
            --sign "$APPLE_INSTALLER_IDENTITY" \
            "build/${APP_NAME}-unsigned.pkg" \
            "build/${APP_NAME}-${{ steps.version.outputs.version }}.pkg"

      - name: Prepare notary API key
        if: ${{ env.APPLE_INSTALLER_CERT_P12_BASE64 != '' && env.APPLE_INSTALLER_CERT_PASSWORD != '' && env.APPLE_INSTALLER_IDENTITY != '' && env.APPLE_API_KEY_P8_BASE64 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != '' }}
        shell: bash
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Notarize and staple pkg
        if: ${{ env.APPLE_INSTALLER_CERT_P12_BASE64 != '' && env.APPLE_INSTALLER_CERT_PASSWORD != '' && env.APPLE_INSTALLER_IDENTITY != '' && env.APPLE_API_KEY_P8_BASE64 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != '' }}
        shell: bash
        run: |
          xcrun notarytool submit "build/${APP_NAME}-${{ steps.version.outputs.version }}.pkg" \
            --key "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "build/${APP_NAME}-${{ steps.version.outputs.version }}.pkg"

      - name: Prepare mac artifact folder
        shell: bash
        run: |
          mkdir -p release/macos
          if [[ -f "build/${APP_NAME}-${{ steps.version.outputs.version }}.pkg" ]]; then
            cp "build/${APP_NAME}-${{ steps.version.outputs.version }}.pkg" release/macos/
          else
            cp "build/${APP_NAME}-unsigned.pkg" "release/macos/${APP_NAME}-${{ steps.version.outputs.version }}-unsigned.pkg"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-pkg
          path: release/macos/

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    env:
      WINDOWS_SIGN_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_PFX_BASE64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate required files
        shell: pwsh
        run: |
          if (!(Test-Path assets/KATS-Tools.dotm)) { throw "Missing assets/KATS-Tools.dotm" }
          if (!(Test-Path assets/KATSUpdater.bat)) { throw "Missing assets/KATSUpdater.bat" }
          if (!(Test-Path windows/KATS-Tools.iss)) { throw "Missing windows/KATS-Tools.iss" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build unsigned installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }

          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/Obuild\windows" `
            "/FKATS-Tools-Setup-${{ steps.version.outputs.version }}" `
            "windows\KATS-Tools.iss"

      - name: Prepare Windows signing certificate
        if: ${{ env.WINDOWS_SIGN_CERT_PFX_BASE64 != '' && env.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\kats-sign.pfx",
            [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_PFX_BASE64)
          )

      - name: Sign installer
        if: ${{ env.WINDOWS_SIGN_CERT_PFX_BASE64 != '' && env.WINDOWS_SIGN_CERT_PASSWORD != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }

          & $signtool sign `
            /fd SHA256 `
            /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f "$env:RUNNER_TEMP\kats-sign.pfx" `
            /p "$env:WINDOWS_SIGN_CERT_PASSWORD" `
            "build\windows\KATS-Tools-Setup-${{ steps.version.outputs.version }}.exe"

      - name: Prepare Windows artifact folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\windows | Out-Null
          Copy-Item "build\windows\KATS-Tools-Setup-${{ steps.version.outputs.version }}.exe" "release\windows\"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: release/windows/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - macos-pkg
      - windows-installer
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-pkg
          path: release/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-exe
          path: release/windows

      - name: Create or update release and upload assets
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = existing.data;
            } catch (e) {
              if (e.status !== 404) throw e;
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                generate_release_notes: true,
                draft: false,
                prerelease: false
              });
              release = created.data;
            }

            const files = [];

            function collectFiles(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) collectFiles(full);
                else files.push(full);
              }
            }

            collectFiles('release/macos');
            collectFiles('release/windows');
            files.push('assets/KATS-Tools.dotm');

            const existingAssets = await github.rest.repos.listReleaseAssets({
              owner,
              repo,
              release_id: release.id
            });

            for (const file of files) {
              const name = path.basename(file);
              const old = existingAssets.data.find(a => a.name === name);
              if (old) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: old.id
                });
              }

              const data = fs.readFileSync(file);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data
              });
            }

